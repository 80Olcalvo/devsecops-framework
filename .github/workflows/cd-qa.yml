name: 🚀 CI/CD Pipeline - Despliegue a GCP QA

on:
  push:
    branches:
      - qa

permissions:
  contents: read
  id-token: write

jobs:
  security-validation:
    name: 🛡️ Validación de Seguridad y Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout de Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar Dependencias
        run: |
          pip install -r app/requirements.txt

      - name: 🧪 Ejecutar Tests
        run: |
          pytest app/tests/ -v

      - name: ⚙️ Configurar Snyk CLI
        uses: snyk/actions/setup@master

      - name: 🔍 Snyk Scan (SCA & SAST)
        run: |
          snyk test --file=app/requirements.txt --severity-threshold=high
          snyk code test app/ --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: 🛡️ Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/security-audit p/owasp-top-ten p/secrets"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  deploy-qa:
    name: ☁️ Build & Deploy a GCP QA
    needs: [security-validation]
    runs-on: ubuntu-latest
    environment: qa
    env:
      IMAGE_NAME: "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_QA }}/${{ secrets.GCP_ARTIFACT_REPO }}/app:${{ github.sha }}"

    steps:
      - name: 📥 Checkout de Código
        uses: actions/checkout@v4

      - name: 🔑 Autenticación con Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_QA }}
          service_account: ${{ secrets.GCP_SA_EMAIL_QA }}

      - name: ⚙️ Configurar gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: 🔨 Construir Imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }} -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_QA }}/${{ secrets.GCP_ARTIFACT_REPO }}/app:latest ./app

      - name: 📤 Push de Imagen a GCP Artifact Registry
        run: |
          docker push ${{ env.IMAGE_NAME }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_QA }}/${{ secrets.GCP_ARTIFACT_REPO }}/app:latest

      - name: 🚀 Desplegar en Google Cloud Run (QA)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME }}-qa
          image: ${{ env.IMAGE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          flags: "--allow-unauthenticated --port=8000"
